<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spresso Coffee</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="main_container">
        <nav class="navbar">
            <img src="logo.png" class="logo">
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">SERVICES</a></li>
            </ul>
        </nav>

        <div class="content">
            <h1>BREWED<br>COFFEE</h1>
            <p>Crafting Moments, One Coffee at <br>a Time.</p>
            <button id="buy-now-btn">BUY NOW</button>
        </div>
        <img src="fresh.jpg" class="coffee">
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Select Your Coffee</h2>
            <form id="coffee-form">
                <label>Choose your coffee:</label>
                <div class="coffee-options">
                    <label>
                        <input type="radio" name="coffee-type" value="Espresso" checked>
                        <img src="espresso.png" alt="Espresso" class="coffee-image">
                        Espresso
                    </label>
                    <label>
                        <input type="radio" name="coffee-type" value="Americano">
                        <img src="americano.png" alt="Americano" class="coffee-image">
                        Americano
                    </label>
                    <label>
                        <input type="radio" name="coffee-type" value="Latte">
                        <img src="latte.png" alt="Latte" class="coffee-image">
                        Latte
                    </label>
                    <label>
                        <input type="radio" name="coffee-type" value="Cappuccino">
                        <img src="cappuccino.png" alt="Cappuccino" class="coffee-image">
                        Cappuccino
                    </label>
                </div>
                <button type="submit">Add to Cart</button>
            </form>
        </div>
    </div>

    <div id="cart-modal" class="cart-modal">
        <div class="cart-modal-content">
            <span class="close-cart">&times;</span>
            <h2>Your Cart</h2>
            <ul id="cart-items-list"></ul>
            <button id="checkout-btn">Checkout</button>
        </div>
    </div>

    <div class="cart">
        <i class="fa fa-shopping-cart"></i>
        <span id="cart-count">0</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
